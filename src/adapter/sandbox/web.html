<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VanBot Sandbox 模拟环境</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #f0f2f5; color: #333; display: flex; overflow: hidden;
  }
  /* 左侧会话栏 */
  .sidebar {
    width: 240px; background: #fff; border-right: 1px solid #e6e8eb;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar-head {
    padding: 16px 14px 12px; display: flex; align-items: center; gap: 8px;
  }
  .sidebar-head .logo {
    width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg,#4f7cff,#6a5cff);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
  }
  .sidebar-head .title { font-size: 15px; font-weight: 700; }
  .sidebar-head .sub { font-size: 11px; color: #9aa0a6; margin-top: 1px; }
  .sess-label { font-size: 11px; color: #9aa0a6; padding: 6px 14px 4px; }
  .session-list { flex: 1; overflow-y: auto; padding-bottom: 10px; }
  .sess-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer;
    border-left: 3px solid transparent;
  }
  .sess-item:hover { background: #f5f7fa; }
  .sess-item.active { background: #eef3ff; border-left-color: #4f7cff; }
  .sess-avatar {
    width: 38px; height: 38px; border-radius: 10px; color: #fff; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600;
  }
  .sess-info { overflow: hidden; }
  .sess-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess-desc { font-size: 11px; color: #9aa0a6; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 右侧聊天区 */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-head {
    height: 58px; background: #fff; border-bottom: 1px solid #e6e8eb;
    display: flex; align-items: center; padding: 0 18px; gap: 10px; flex-shrink: 0;
  }
  .chat-title { font-size: 15px; font-weight: 700; }
  .chat-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eef3ff; color: #4f7cff; }
  .id-switch { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .id-switch .id-label { font-size: 12px; color: #9aa0a6; }
  .id-btn {
    border: 1px solid #d9dde3; border-radius: 14px; background: #fafbfc; color: #3d434b;
    padding: 4px 14px; font-size: 13px; cursor: pointer;
  }
  .id-btn:hover { background: #eef1f6; }
  .id-btn.active { background: #4f7cff; border-color: #4f7cff; color: #fff; }
  .chat-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
  .msg { display: flex; gap: 10px; margin-bottom: 14px; }
  .msg.self { flex-direction: row-reverse; }
  .msg-avatar {
    width: 36px; height: 36px; border-radius: 9px; color: #fff; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;
  }
  .msg-main { max-width: 62%; display: flex; flex-direction: column; }
  .msg.self .msg-main { align-items: flex-end; }
  .msg-name { font-size: 11px; color: #9aa0a6; margin-bottom: 3px; }
  .bubble {
    padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.55;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg.self .bubble { background: #95ec69; border-top-right-radius: 2px; }
  .msg.other .bubble { background: #fff; border-top-left-radius: 2px; border: 1px solid #e9ebef; }
  .msg.bot .bubble { background: #f0f4ff; border: 1px solid #dbe4ff; }
  .msg-time { font-size: 10px; color: #c2c7cd; margin-top: 3px; }
  .empty { text-align: center; color: #c2c7cd; margin-top: 50px; font-size: 13px; line-height: 1.9; }
  /* 底部输入 */
  .chat-input { background: #fff; border-top: 1px solid #e6e8eb; padding: 8px 14px 12px; flex-shrink: 0; }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  .input-row textarea {
    flex: 1; resize: none; border: 1px solid #d9dde3; border-radius: 10px;
    padding: 9px 12px; font-size: 14px; font-family: inherit; outline: none; min-height: 40px; max-height: 120px;
  }
  .input-row textarea:focus { border-color: #4f7cff; }
  .send-btn {
    width: 72px; height: 40px; border: none; border-radius: 10px; background: #4f7cff; color: #fff;
    font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  .send-btn:hover { background: #3f6cf0; }
  .send-btn:active { transform: scale(.97); }
  .hint { font-size: 11px; color: #c2c7cd; margin-top: 6px; }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="logo">S</div>
      <div>
        <div class="title">VanBot Sandbox</div>
        <div class="sub" id="selfNameLine">模拟环境</div>
      </div>
    </div>
    <div class="sess-label">固定会话</div>
    <div class="session-list" id="sessionList"></div>
  </div>

  <div class="main">
    <div class="chat-head">
      <div class="chat-title" id="chatTitle">未选择会话</div>
      <div class="chat-tag" id="chatTag"></div>
      <div class="id-switch">
        <span class="id-label">身份</span>
        <button class="id-btn active" data-id="User1">User1</button>
        <button class="id-btn" data-id="User2">User2</button>
      </div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input">
      <div class="input-row">
        <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send-btn" id="btnSend">发送</button>
      </div>
      <div class="hint">Enter 发送，Shift+Enter 换行</div>
    </div>
  </div>

<script>
// ---------- 固定会话与身份 ----------
const IDENTITIES = [
  { id: "User1", name: "User1" },
  { id: "User2", name: "User2" },
]
// 固定 2 个群聊 + 1 个私聊；私聊在服务端按身份分 key，前端合并为一个"私聊"视图
const SESSIONS = [
  { key: "group:10001", scene: "group", gid: "10001", name: "群聊 · 10001", desc: "群号 10001" },
  { key: "group:10002", scene: "group", gid: "10002", name: "群聊 · 10002", desc: "群号 10002" },
  { key: "private:all", scene: "private", gid: "", name: "私聊", desc: "Bot × User1/User2" },
]

const state = {
  selfName: "Bot",
  seq: 0,
  current: "group:10001",
  currentId: "User1",
}

// 服务端消息是否属于某个前端会话
function msgInSession(m, sess) {
  if (sess.scene === "group") return m.scene === "group" && String(m.groupId) === sess.gid
  return m.scene === "private"
}

// 从服务端消息还原会话 key（私聊按身份区分，前端合并）
function serverKeyOf(m) {
  return m.scene === "group" ? "group:" + m.groupId : "private:" + m.userId
}

const COLORS = ["#5b8def", "#f2a93b", "#4ecdc4", "#8b6ce8", "#3fb97e", "#e85d5d", "#5a9bd8", "#e86a8a"]
function hashColor(name) {
  let h = 0
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0
  return COLORS[h % COLORS.length]
}

// 每个前端会话的消息缓冲
window.__msgs = { "group:10001": [], "group:10002": [], "private:all": [] }

// ---------- 会话列表 ----------
function renderSessions() {
  const el = document.getElementById("sessionList")
  el.innerHTML = ""
  for (const s of SESSIONS) {
    const div = document.createElement("div")
    div.className = "sess-item" + (s.key === state.current ? " active" : "")
    const icon = s.scene === "group" ? "👥" : "💬"
    div.innerHTML =
      '<div class="sess-avatar" style="background:' + hashColor(s.name) + '">' + icon + "</div>" +
      '<div class="sess-info"><div class="sess-name"></div><div class="sess-desc"></div></div>'
    div.querySelector(".sess-name").textContent = s.name
    div.querySelector(".sess-desc").textContent = s.desc
    div.onclick = () => selectSession(s.key)
    el.appendChild(div)
  }
}

function selectSession(key) {
  state.current = key
  const s = SESSIONS.find((x) => x.key === key)
  document.getElementById("chatTitle").textContent = s.name
  document.getElementById("chatTag").textContent = s.scene === "group" ? "群聊" : "私聊"
  renderSessions()
  renderMessages()
}

// ---------- 身份切换 ----------
document.querySelectorAll(".id-btn").forEach((btn) => {
  btn.onclick = () => {
    state.currentId = btn.dataset.id
    document.querySelectorAll(".id-btn").forEach((b) => b.classList.toggle("active", b === btn))
  }
})

// ---------- 消息渲染 ----------
function renderMessages() {
  const sess = SESSIONS.find((x) => x.key === state.current)
  const body = document.getElementById("chatBody")
  if (!sess) return
  const list = window.__msgs[sess.key] || []
  if (list.length === 0) {
    body.innerHTML = '<div class="empty">还没有消息，从下方输入框发送第一条</div>'
    return
  }
  body.innerHTML = ""
  for (const m of list) {
    const isBot = m.role === "bot"
    const isSelf = m.role === "user"
    const row = document.createElement("div")
    row.className = "msg " + (isBot ? "bot" : isSelf ? "self" : "other")
    const ava = document.createElement("div")
    ava.className = "msg-avatar"
    ava.style.background = hashColor(isBot ? state.selfName : m.name)
    ava.textContent = (isBot ? state.selfName : m.name).slice(0, 1)
    const main = document.createElement("div")
    main.className = "msg-main"
    const nm = document.createElement("div")
    nm.className = "msg-name"
    nm.textContent = isBot ? state.selfName : m.name
    const bubble = document.createElement("div")
    bubble.className = "bubble"
    bubble.textContent = m.text
    const tm = document.createElement("div")
    tm.className = "msg-time"
    const d = new Date(m.time * 1000)
    tm.textContent = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2)
    main.appendChild(nm); main.appendChild(bubble); main.appendChild(tm)
    row.appendChild(ava); row.appendChild(main)
    body.appendChild(row)
  }
  body.scrollTop = body.scrollHeight
}

// ---------- 轮询服务端消息 ----------
async function poll() {
  try {
    const res = await fetch("/api/state?since=" + state.seq)
    const data = await res.json()
    state.seq = data.seq
    if (data.selfName) state.selfName = data.selfName
    for (const m of data.messages || []) {
      // 归入对应前端会话（群聊按群号，私聊合并）
      if (m.scene === "group") {
        const key = "group:" + m.groupId
        if (!window.__msgs[key]) window.__msgs[key] = []
        window.__msgs[key].push(m)
      } else {
        window.__msgs["private:all"].push(m)
      }
    }
    document.getElementById("selfNameLine").textContent = state.selfName + " · 网页模拟"
    if (data.messages && data.messages.length) renderMessages()
  } catch (e) { /* 忽略轮询错误 */ }
}

// ---------- 发送 ----------
async function sendMsg(text) {
  if (!state.current || !text) return
  const sess = SESSIONS.find((x) => x.key === state.current)
  if (!sess) return
  const id = state.currentId
  const payload = { scene: sess.scene, groupId: sess.gid, userId: id, name: id, text }
  try {
    await fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
    // 发送成功后立即拉取一次，消息只经服务端一条路径渲染，避免与轮询重复显示
    poll()
  } catch (e) { /* 服务端重新入队，下次轮询纠正 */ }
}

// ---------- 初始化 ----------
document.getElementById("btnSend").onclick = () => {
  const inp = document.getElementById("input")
  sendMsg(inp.value.trim())
  inp.value = ""
}
document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault()
    document.getElementById("btnSend").click()
  }
})
renderSessions()
selectSession(state.current)
setInterval(poll, 1000)
poll()
</script>
</body>
</html>
